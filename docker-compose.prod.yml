services:
  app:
    image: ${APP_IMAGE:-ghcr.io/artiomcatruc/btc-solar-website:latest}
    restart: unless-stopped
    # Only bind to localhost — Caddy handles the public HTTPS
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-btcsolar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-btcsolar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only expose locally, never to the public internet
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btcsolar}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
